server {
    listen 80;
    server_name __DOMAIN__;
    # Isolate this secret-entry site from inherited WAF URI logging/response filters.
    access_by_lua_block { return }
    header_filter_by_lua_block { return }
    body_filter_by_lua_block { return }
    log_by_lua_block { return }
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/__DOMAIN__; }
    location / { return 302 https://www.baidu.com/; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    ssl_certificate /www/server/panel/vhost/cert/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # Isolate this secret-entry site from inherited WAF URI logging/response filters.
    access_by_lua_block { return }
    header_filter_by_lua_block { return }
    body_filter_by_lua_block { return }
    log_by_lua_block { return }
    access_log off;
    error_log /dev/null;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    error_page 400 401 403 404 405 408 413 414 429 500 502 503 504 =302 https://www.baidu.com/;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/__DOMAIN__; }
    location ^~ /internal/ { return 302 https://www.baidu.com/; }
    location / {
        proxy_pass http://127.0.0.1:18189;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Powered-By;
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
